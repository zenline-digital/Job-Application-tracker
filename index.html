function loadData() { return JSON.parse(localStorage.getItem(DATA_KEY) || '[]'); }
function saveData(data) { localStorage.setItem(DATA_KEY, JSON.stringify(data)); }
function loadRejected() { return JSON.parse(localStorage.getItem(REJECTED_KEY) || '[]'); }
function saveRejected(data) { localStorage.setItem(REJECTED_KEY, JSON.stringify(data)); }

function searchCompanies() {
  const emirate = document.getElementById('searchEmirate').value;
  const type = document.getElementById('searchType').value;
  if (!emirate || !type) { alert('Please select Emirate and Business Type'); return; }
  
  const companies = COMPANY_DATABASE[emirate]?.[type] || [];
  const selected = loadData().map(c => c.name.toLowerCase());
  const rejected = loadRejected();
  
  const results = companies.filter(c => 
    !selected.includes(c.name.toLowerCase()) && 
    !rejected.includes(c.name.toLowerCase())
  );
  
  displaySearchResults(results.slice(0, 50));
}

function displaySearchResults(results) {
  const container = document.getElementById('searchResults');
  if (results.length === 0) { container.innerHTML = '<div class="empty-state"><p>All companies viewed! ✓</p></div>'; return; }
  
  let html = `<div class="results-count">Found ${results.length} companies (Top 50)</div>`;
  results.forEach((company, idx) => {
    const website = company.website ? `<a href="https://${company.website}" target="_blank">🌐 ${company.website}</a>` : '—';
    const statusId = 'status-' + idx;
    html += `<div class="company-card">
      <div class="company-header">
        <h3>${company.name}</h3>
        <div class="company-actions">
          <button class="btn-close" onclick="rejectCompany('${company.name.replace(/'/g, "\\'")}'); searchCompanies();">×</button>
          <button class="btn success small" onclick="document.getElementById('${statusId}').classList.toggle('hidden');">Select</button>
        </div>
      </div>
      <div class="company-detail">
        <div class="detail-item"><div class="detail-label">Employees</div><div class="detail-value">${company.employees}</div></div>
        <div class="detail-item"><div class="detail-label">Website</div><div class="detail-value">${website}</div></div>
      </div>
      <p style="font-size: 13px; color: #666; margin: 0.5rem 0 0 0;">${company.notes}</p>
      <div class="status-options hidden" id="${statusId}">
        <button class="status-btn" onclick="addCompany('${company.name.replace(/'/g, "\\'")}', 'viewed', '${company.website}', '${company.employees}', '${company.notes}')">Viewed</button>
        <button class="status-btn" onclick="addCompany('${company.name.replace(/'/g, "\\'")}', 'contacted', '${company.website}', '${company.employees}', '${company.notes}')">Contacted</button>
        <button class="status-btn" onclick="addCompany('${company.name.replace(/'/g, "\\'")}', 'pending', '${company.website}', '${company.employees}', '${company.notes}')">Pending Response</button>
        <button class="status-btn" onclick="addCompany('${company.name.replace(/'/g, "\\'")}', 'interested', '${company.website}', '${company.employees}', '${company.notes}')">Interested</button>
      </div>
    </div>`;
  });
  
  container.innerHTML = html;
}

function addCompany(name, status, website, employees, notes) {
  const data = loadData();
  data.push({
    id: Date.now(),
    name,
    status,
    website,
    employees,
    notes,
    phone: '',
    email: '',
    contactName: '',
    appliedDate: '',
    nextFollowUpDate: '',
    followUpNotes: '',
    createdAt: new Date().toISOString().split('T')[0]
  });
  saveData(data);
  alert(`✓ ${name} added!`);
  searchCompanies();
  renderSelected();
}

function rejectCompany(name) {
  const rejected = loadRejected();
  if (!rejected.includes(name)) {
    rejected.push(name);
    saveRejected(rejected);
  }
}

function renderSelected() {
  const data = loadData();
  const container = document.getElementById('selectedList');
  
  if (data.length === 0) { container.innerHTML = '<div class="empty-state"><p>No companies selected yet</p></div>'; return; }
  
  let html = '<div class="selected-list">';
  data.forEach(item => {
    const website = item.website ? `<a href="https://${item.website}" target="_blank">🌐 ${item.website}</a>` : '—';
    
    html += `<div class="company-card">
      <div class="company-header">
        <div>
          <h3 style="margin: 0 0 0.5rem 0;">${item.name}</h3>
          <span class="status-badge status-${item.status}">${item.status.toUpperCase()}</span>
        </div>
        <button class="btn-close" onclick="deleteCompany(${item.id})">×</button>
      </div>
      <p style="font-size: 13px; color: #666; margin: 0.5rem 0;">${item.notes}</p>
      
      <div class="inline-edit">
        <div class="edit-section">
          <h4>📞 Contact Details</h4>
          <div class="form-grid" style="grid-template-columns: 1fr 1fr;">
            <input type="tel" id="phone-${item.id}" placeholder="Phone" value="${item.phone}">
            <input type="text" id="name-${item.id}" placeholder="Contact Name" value="${item.contactName}">
            <input type="email" id="email-${item.id}" placeholder="Email" value="${item.email}">
          </div>
        </div>
        
        <div class="edit-section">
          <h4>📋 Follow-up Schedule</h4>
          <div class="form-grid" style="grid-template-columns: 1fr 1fr;">
            <input type="date" id="date-${item.id}" value="${item.appliedDate}">
            <input type="date" id="followup-${item.id}" value="${item.nextFollowUpDate}">
          </div>
          <textarea id="notes-${item.id}" placeholder="Follow-up Notes">${item.followUpNotes}</textarea>
        </div>
        
        <div class="button-group" style="margin-top: 1rem;">
          <button class="btn success small" onclick="updateCompany(${item.id})">✓ Save Details</button>
          <button class="btn small" onclick="editStatus(${item.id})">Change Status</button>
        </div>
      </div>
    </div>`;
  });
  html += '</div>';
  container.innerHTML = html;
}

function updateCompany(id) {
  const data = loadData();
  const item = data.find(x => x.id === id);
  if (!item) return;
  
  item.phone = document.getElementById(`phone-${id}`).value;
  item.contactName = document.getElementById(`name-${id}`).value;
  item.email = document.getElementById(`email-${id}`).value;
  item.appliedDate = document.getElementById(`date-${id}`).value;
  item.nextFollowUpDate = document.getElementById(`followup-${id}`).value;
  item.followUpNotes = document.getElementById(`notes-${id}`).value;
  
  saveData(data);
  alert('✓ Saved!');
  renderSelected();
  renderReminders();
}

function editStatus(id) {
  const data = loadData();
  const item = data.find(x => x.id === id);
  const newStatus = prompt(`Current: ${item.status}\n\nEnter: viewed, contacted, pending, interested`);
  if (newStatus && ['viewed','contacted','pending','interested'].includes(newStatus)) {
    item.status = newStatus;
    saveData(data);
    renderSelected();
  }
}

function deleteCompany(id) {
  if (!confirm('Delete this company?')) return;
  let data = loadData();
  data = data.filter(x => x.id !== id);
  saveData(data);
  renderSelected();
  renderReminders();
}

function renderReminders() {
  const data = loadData();
  const container = document.getElementById('remindersContainer');
  const today = new Date();
  
  const reminders = data.filter(x => x.nextFollowUpDate).sort((a, b) => new Date(a.nextFollowUpDate) - new Date(b.nextFollowUpDate));
  
  if (reminders.length === 0) { container.innerHTML = '<div class="empty-state"><p>No follow-ups scheduled</p></div>'; return; }
  
  let html = '<div>';
  reminders.forEach(item => {
    const followupDate = new Date(item.nextFollowUpDate);
    const isOverdue = followupDate < today;
    const daysLeft = Math.ceil((followupDate - today) / (1000 * 60 * 60 * 24));
    
    html += `<div class="company-card" style="border-left: 4px solid ${isOverdue ? '#d32f2f' : '#3d72b8'};">
      <h3>${item.name} ${isOverdue ? '⚠️ OVERDUE' : ''}</h3>
      <p style="font-size: 13px; margin: 0.5rem 0;">
        📅 <strong>${item.nextFollowUpDate}</strong> ${daysLeft > 0 ? `(in ${daysLeft} days)` : ''}
        ${item.appliedDate ? `<br>📝 Applied: ${item.appliedDate}` : ''}
        ${item.contactName ? `<br>👤 ${item.contactName}` : ''}
        ${item.phone ? `<br>📱 ${item.phone}` : ''}
        ${item.email ? `<br>✉️ ${item.email}` : ''}
      </p>
      ${item.followUpNotes ? `<p style="font-size: 12px; color: #666; margin: 0.5rem 0; border-top: 1px solid #eee; padding-top: 0.5rem;"><strong>Notes:</strong> ${item.followUpNotes}</p>` : ''}
    </div>`;
  });
  html += '</div>';
  container.innerHTML = html;
}

function setActiveTab(tabName) {
  document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
  document.getElementById(tabName + '-tab').classList.add('active');
  
  if (tabName === 'selected') renderSelected();
  if (tabName === 'reminders') renderReminders();
}

document.querySelectorAll('.tab-button').forEach(btn => {
  btn.addEventListener('click', function() {
    setActiveTab(this.getAttribute('data-tab'));
  });
});

renderSelected();
</script>
