<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B Company Tracker - UAE Database</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .badge {
            display: inline-block;
            background: #4CAF50;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-left: 10px;
        }
        
        .tabs {
            display: flex;
            border-bottom: 2px solid #eee;
        }
        
        .tab-button {
            flex: 1;
            padding: 15px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1em;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            text-align: center;
        }
        
        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background: #f5f5f5;
        }
        
        .tab-content {
            display: none;
            padding: 30px;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .search-section {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 15px;
            margin-bottom: 30px;
            align-items: end;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        
        select, input {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
        }
        
        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        .company-card {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;
        }
        
        .company-info h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .company-info p {
            margin: 6px 0;
            color: #666;
            font-size: 0.95em;
        }
        
        .company-info a {
            color: #667eea;
            text-decoration: none;
        }
        
        .results-info {
            padding: 15px;
            background: #e8f5e9;
            border-radius: 6px;
            margin-bottom: 20px;
            color: #2e7d32;
        }
        
        .company-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 150px;
        }
    </style>
</head>
<body>

                <div class="form-group">

                <button onclick="searchCompanies()">Search</button>
            </div>
            
            <div id="results-container"></div>
        </div>
        
        <div class="tab-content" id="my-companies">
            <button onclick="exportCompanies()" style="background: #4CAF50; margin-bottom: 20px;">📥 Export Companies</button>
            <div id="my-companies-list"></div>

    </div>

        let selectedCompanies = [];
        
        function loadSelectedCompanies() {
            const saved = localStorage.getItem('selectedCompanies');
            selectedCompanies = saved ? JSON.parse(saved) : [];
        }
        
        function saveSelectedCompanies() {
            localStorage.setItem('selectedCompanies', JSON.stringify(selectedCompanies));
        }
        
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
            
            if (tab === 'my-companies') {
                displayMyCompanies();
            }
        }
        
        function searchCompanies() {
            const emirate = document.getElementById('emirate').value;
            const businessType = document.getElementById('business-type').value;
            const searchName = document.getElementById('search-name').value.toLowerCase();
            
            let results = [];
            
            for (const [emir, types] of Object.entries(companiesDatabase)) {
                if (emirate && emir !== emirate) continue;
                
                for (const [type, companies] of Object.entries(types)) {
                    if (businessType && type !== businessType) continue;
                    
                    for (const company of companies) {
                        if (!searchName || company.name.toLowerCase().includes(searchName)) {
                            results.push({...company, emirate: emir, type: type});
                        }
                    }
                }
            }
            
            displayResults(results);
        }
        
        function displayResults(results) {
            const container = document.getElementById('results-container');
            
            if (results.length === 0) {
                container.innerHTML = '<div class="results-info" style="background: #ffebee; color: #c62828;">No companies found</div>';
                return;
            }
            
            let html = `<div class="results-info">Found ${results.length} companies</div>`;
            
            results.forEach(company => {
                const isSelected = selectedCompanies.some(c => c.name === company.name && c.emirate === company.emirate);
                html += `
                    <div class="company-card">
                        <div class="company-info">
                            <h3>${company.name}</h3>
                            <p><strong>Emirate:</strong> ${company.emirate}</p>
                            <p><strong>Type:</strong> ${company.type}</p>
                            <p><strong>Description:</strong> ${company.description}</p>
                            ${company.website ? `<p><strong>Website:</strong> <a href="https://${company.website}" target="_blank">${company.website}</a></p>` : ''}
                            <p><strong>Email:</strong> <a href="mailto:${company.email}">${company.email}</a></p>
                            <p><strong>Phone:</strong> ${company.phone}</p>
                        </div>
                        <div class="company-actions">
                            <button onclick='addCompany(${JSON.stringify(company).replace(/'/g, "&apos;")})' ${isSelected ? 'disabled style="opacity:0.5"' : ''}>
                                ${isSelected ? '✓ Added' : '+ Add'}
                            </button>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function addCompany(company) {
            if (!selectedCompanies.find(c => c.name === company.name && c.emirate === company.emirate)) {
                company.status = 'Pending';
                selectedCompanies.push(company);
                saveSelectedCompanies();
                alert(`${company.name} added!`);
                searchCompanies();
            }
        }
        
        function displayMyCompanies() {
            const container = document.getElementById('my-companies-list');
            
            if (selectedCompanies.length === 0) {
                container.innerHTML = '<div class="results-info" style="background: #e8f5e9;">Add companies to track your outreach</div>';
                return;
            }
            
            let html = `<div class="results-info">${selectedCompanies.length} companies tracked</div>`;
            
            selectedCompanies.forEach((company, index) => {
                html += `
                    <div class="company-card">
                        <div class="company-info">
                            <h3>${company.name}</h3>
                            <p><strong>Emirate:</strong> ${company.emirate}</p>
                            <p><strong>Type:</strong> ${company.type}</p>
                            ${company.website ? `<p><strong>Website:</strong> <a href="https://${company.website}" target="_blank">${company.website}</a></p>` : ''}
                            <p><strong>Email:</strong> <a href="mailto:${company.email}">${company.email}</a></p>
                            <p><strong>Phone:</strong> ${company.phone}</p>
                            <p><strong>Status:</strong> <span style="padding:4px 8px;background:#f0f0f0;border-radius:4px;">${company.status || 'Pending'}</span></p>
                        </div>
                        <div class="company-actions">
                            <select onchange="updateStatus(${index}, this.value)" style="width:100%;padding:8px;">
                                <option value="Pending" ${(company.status || 'Pending') === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="Contacted" ${company.status === 'Contacted' ? 'selected' : ''}>Contacted</option>
                                <option value="Interested" ${company.status === 'Interested' ? 'selected' : ''}>Interested</option>
                                <option value="Rejected" ${company.status === 'Rejected' ? 'selected' : ''}>Rejected</option>
                                <option value="Closed" ${company.status === 'Closed' ? 'selected' : ''}>Closed</option>
                            </select>
                            <button style="background: #f44336;" onclick="removeCompany(${index})">Remove</button>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function updateStatus(index, status) {
            selectedCompanies[index].status = status;
            saveSelectedCompanies();
            displayMyCompanies();
        }
        
        function removeCompany(index) {
            if (confirm('Remove this company?')) {
                selectedCompanies.splice(index, 1);
                saveSelectedCompanies();
                displayMyCompanies();
            }
        }
        
        function exportCompanies() {
            if (selectedCompanies.length === 0) {
                alert('Add companies first!');
                return;
            }
            
            const dataStr = JSON.stringify(selectedCompanies, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `b2b-companies-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
        }
        
        loadSelectedCompanies();
    </script>
</body>
